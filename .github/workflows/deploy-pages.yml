name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Sent by micronaut-projects/pyronaut (or publish-upstream-updates.yml) when
  # the docs change; `client_payload.sha` pins the pyronaut commit to render.
  repository_dispatch:
    types:
      - pyronaut-docs-updated
  workflow_dispatch:
    inputs:
      docs_ref:
        description: Pyronaut branch, tag, or SHA to render the docs from
        required: false
        default: 0.0.x
      guides_repository:
        description: Guides repository to render the Python guides from
        required: false
        default: micronaut-projects/micronaut-guides
      guides_ref:
        description: Guides branch, tag, or SHA to render the Python guides from
        required: false
        default: master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check out guides project
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.guides_repository || 'micronaut-projects/micronaut-guides' }}
          ref: ${{ inputs.guides_ref || 'master' }}
          path: external/micronaut-guides
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # The guides build generates each Python guide's sample project with
      # Micronaut Starter; scripts/render-guides.mjs runs it.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Cache Gradle dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-guides-${{ hashFiles('external/micronaut-guides/**/*.gradle') }}
          restore-keys: gradle-guides-
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - run: npm ci
      - run: npm run build
        env:
          PYRONAUT_DOCS_REF: ${{ github.event.client_payload.sha || inputs.docs_ref || '0.0.x' }}
          MICRONAUT_GUIDES_DIR: ${{ github.workspace }}/external/micronaut-guides
          GUIDES_REPOSITORY: ${{ inputs.guides_repository || 'micronaut-projects/micronaut-guides' }}
          GUIDES_REF: ${{ inputs.guides_ref || 'master' }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
