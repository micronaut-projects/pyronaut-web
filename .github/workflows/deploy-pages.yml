name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Sent by micronaut-projects/pyronaut (or publish-upstream-updates.yml) when
  # the docs change; `client_payload.sha` pins the pyronaut commit to render.
  repository_dispatch:
    types:
      - pyronaut-docs-updated
  workflow_dispatch:
    inputs:
      docs_ref:
        description: Pyronaut branch, tag, or SHA to render the docs from
        required: false
        default: 0.0.x

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm ci
      - run: npm run build
        env:
          PYRONAUT_DOCS_REF: ${{ github.event.client_payload.sha || inputs.docs_ref || '0.0.x' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
