name: Publish Upstream Updates

# GitHub Actions cannot subscribe to events in another repository, so this
# workflow polls micronaut-projects/pyronaut and redeploys the site when a
# release is published that the published docs weren't rendered from, and
# micronaut-projects/micronaut-guides for a commit the published Python guides
# don't have.

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pages: read

concurrency:
  group: publish-upstream-updates
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
  DOCS_REPOSITORY: micronaut-projects/pyronaut
  GUIDES_REPOSITORY: micronaut-projects/micronaut-guides
  GUIDES_BRANCH: master

jobs:
  docs:
    name: Publish the latest Pyronaut release docs
    runs-on: ubuntu-latest
    steps:
      - name: Compare published docs and latest release
        id: pending
        run: |
          set -euo pipefail
          # Newest non-draft release, pre-releases included (/releases/latest skips them).
          latest=$(gh api "repos/$DOCS_REPOSITORY/releases?per_page=20" --jq '[.[] | select(.draft | not)][0].tag_name // empty')
          site=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.html_url')
          published=$(curl -fsSL "${site%/}/docs/source.json" | jq -r '.ref // empty' || true)
          echo "Latest release: ${latest:-none}"
          echo "Published docs ref: ${published:-none}"

          publish=false
          if [ -n "$latest" ] && [ "$latest" != "$published" ]; then
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "tag=$latest" >> "$GITHUB_OUTPUT"

      - name: Start docs publish
        if: steps.pending.outputs.publish == 'true'
        run: gh workflow run deploy-pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f docs_ref="${{ steps.pending.outputs.tag }}"

  guides:
    name: Publish unpublished Python guides
    runs-on: ubuntu-latest
    steps:
      - name: Compare published and upstream guides
        id: pending
        run: |
          set -euo pipefail
          upstream=$(gh api "repos/$GUIDES_REPOSITORY/commits/$GUIDES_BRANCH" --jq '.sha')
          site=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.html_url')
          published=$(curl -fsSL "${site%/}/guides/source.json" | jq -r '.commit // empty' || true)
          echo "Upstream guides commit: $upstream"
          echo "Published guides commit: ${published:-none}"

          publish=true
          if [ -n "$published" ]; then
            # Up to date when the published commit already contains the branch head.
            status=$(gh api "repos/$GUIDES_REPOSITORY/compare/$upstream...$published" --jq '.status' || echo unknown)
            if [ "$status" = "identical" ] || [ "$status" = "ahead" ]; then
              publish=false
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "sha=$upstream" >> "$GITHUB_OUTPUT"

      - name: Start guides publish
        if: steps.pending.outputs.publish == 'true'
        run: gh workflow run deploy-guides.yml --repo "$GITHUB_REPOSITORY" --ref main -f guides_ref="${{ steps.pending.outputs.sha }}"
